name: Migrate prod DB

on:
  push:
    branches: [main]
    paths:
      - drizzle-shared/**
      - drizzle.config.ts
      - .github/workflows/migrate.yml
  workflow_dispatch:

concurrency:
  group: migrate-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - name: Are the secrets set?
        run: |
          if [ -z "$TURSO_DATABASE_URL" ] || [ -z "$TURSO_AUTH_TOKEN" ]; then
            echo "::error::Add the repo secrets TURSO_DATABASE_URL and TURSO_AUTH_TOKEN."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Can we reach the DB?
        run: |
          node --input-type=module -e '
          import { createClient } from "@libsql/client";
          const url = process.env.TURSO_DATABASE_URL;
          const token = process.env.TURSO_AUTH_TOKEN;
          console.log("url scheme ok:", url.startsWith("libsql://"), "| url has space:", /\s/.test(url), "| token has space:", /\s/.test(token));
          try {
            const client = createClient({ url, authToken: token });
            await client.execute("select 1");
            console.log("DB reachable");
          } catch (error) {
            console.error("DB error:", error.message);
            process.exit(1);
          }'
      - run: pnpm db:migrate:remote
